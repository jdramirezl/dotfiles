palette = "catppuccin_mocha"
command_timeout = 1000

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
surface1 = "#45475a"
base = "#1e1e2e"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[directory]
read_only = " 󰌾"
truncation_length = 6
truncate_to_repo = true
style = "bold blue"

[cmd_duration]
min_time = 1500
format = "took [$duration](bold peach) "

[username]
show_always = false
format = "[$user](bold green) "

[hostname]
ssh_only = true
format = "on [$hostname](bold yellow) "
trim_at = "."

[localip]
disabled = true

[git_branch]
symbol = "󰊢 "
style = "bold mauve"

[git_status]
style = "bold red"

[python]
symbol = "󰌠 "
format = "via [$symbol${pyenv_prefix}(${version})( \\($virtualenv\\))]($style) "
style = "bold yellow"
python_binary = ["./.venv/bin/python", "./venv/bin/python", "python3", "python"]
detect_extensions = ["py"]
version_format = "v${raw}"

[nodejs]
symbol = "󰎙 "
format = "via [$symbol$version](bold green) "
detect_files = ["package.json", ".node-version"]

[rust]
symbol = "󱘗 "

[golang]
symbol = "󰟓 "

[java]
symbol = "󰬷 "

[docker_context]
symbol = "󰡨 "
format = "via [$symbol$context]($style) "
only_with_files = true
detect_files = ["compose.yaml", "compose.yml", "docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
